<meta charset="utf-8" />
<title>STRAITS — design lab</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600&family=Oswald:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#060a12;--panel:#0b111c;--line:#1b2740;--ink:#c3ccdd;--mut:#6b7a95;--brand:#3fb6c9;--crit:#e5484d;
    --mono:'IBM Plex Mono',ui-monospace,monospace;--disp:'IBM Plex Sans Condensed',sans-serif}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:var(--mono);color:var(--ink)}
  #deck{position:fixed;inset:0;right:300px}
  /* sample chrome to preview the full look */
  #chrome{position:fixed;top:16px;left:16px;z-index:3;width:250px}
  .pnl{background:rgba(11,17,28,.92);border:1px solid var(--line);margin-bottom:10px}
  .ph{padding:8px 11px;border-bottom:1px solid var(--line);font-family:var(--disp);text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:var(--brand)}
  .pb{padding:9px 11px;font-size:11px;line-height:1.7}
  .stat .v{color:var(--brand);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
  .al{display:flex;gap:8px;font-size:11px}.al .sev{color:var(--crit);font-weight:600}
  button.act{width:100%;background:transparent;border:1px solid var(--crit);color:var(--crit);font-family:var(--mono);letter-spacing:.1em;padding:7px;font-size:11px;cursor:pointer;margin-top:2px}
  #cls{position:fixed;top:0;left:0;right:300px;text-align:center;font-family:var(--disp);letter-spacing:.3em;font-size:9px;color:var(--mut);padding:3px;z-index:4;background:rgba(6,10,18,.6)}
  /* controls */
  #ctl{position:fixed;top:0;right:0;bottom:0;width:300px;background:#080d16;border-left:1px solid var(--line);z-index:5;overflow-y:auto;font-size:11px}
  #ctl h2{font-family:var(--disp);text-transform:uppercase;letter-spacing:.25em;font-size:12px;color:var(--brand);padding:14px 16px 4px;margin:0}
  .grp{padding:8px 16px;border-bottom:1px solid #101826}.grp .lb{color:var(--mut);letter-spacing:.14em;font-size:10px;margin-bottom:7px;text-transform:uppercase}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .opt{padding:5px 10px;border:1px solid var(--line);color:var(--mut);cursor:pointer;border-radius:2px;letter-spacing:.05em}
  .opt.on{color:var(--brand);border-color:var(--brand);background:rgba(63,182,201,.08)}
  /* effect overlays */
  #scan{position:fixed;inset:0;right:300px;pointer-events:none;z-index:2;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);opacity:0;transition:.2s}
  #vig{position:fixed;inset:0;right:300px;pointer-events:none;z-index:2;box-shadow:inset 0 0 240px 40px rgba(0,0,0,.7);opacity:0;transition:.2s}
  body.scan #scan{opacity:1} body.vig #vig{opacity:1} body.glow .stat .v,body.glow .ph{text-shadow:0 0 10px currentColor}
</style>
<div id="cls">UNCLASSIFIED // SIMULATION</div>
<div id="deck"></div>
<div id="scan"></div><div id="vig"></div>
<div id="chrome">
  <div class="pnl"><div class="ph">◈ STRAITS · SUEZ</div><div class="pb stat">$ AT RISK<br><span class="v">$8.2B</span></div></div>
  <div class="pnl"><div class="ph">Sentinel · Alerts</div><div class="pb"><div class="al"><span class="sev">▲ CRIT</span><span>SUEZ blocked — 214 vessels affected</span></div></div></div>
  <div class="pnl"><div class="pb"><button class="act">⚠ BLOCK SUEZ</button></div></div>
</div>
<div id="ctl">
  <h2>Design Lab</h2>
  <div class="grp"><div class="lb">Palette</div><div class="seg" id="g_pal"></div></div>
  <div class="grp"><div class="lb">Typography</div><div class="seg" id="g_font"></div></div>
  <div class="grp"><div class="lb">Vessel glyph</div><div class="seg" id="g_ves"></div></div>
  <div class="grp"><div class="lb">Chart style</div><div class="seg" id="g_map"></div></div>
  <div class="grp"><div class="lb">Effects</div><div class="seg" id="g_fx"></div></div>
  <div class="grp"><div class="lb" id="cfg" style="color:var(--brand)"></div></div>
</div>
<script src="https://unpkg.com/deck.gl@9.0.38/dist.min.js"></script>
<script>
const {DeckGL,MapView,SolidPolygonLayer,GeoJsonLayer,PathLayer,ScatterplotLayer,IconLayer}=deck;
const PAL={
  'Radar Cyan':{bg:'#060a12',panel:'11,17,28',line:'#1b2740',ink:'#c3ccdd',mut:'#6b7a95',brand:'#3fb6c9',brandRGB:[63,182,201],land:[22,28,44],lc:[42,54,82],choke:[229,72,77]},
  'Phosphor Amber':{bg:'#0a0805',panel:'18,14,8',line:'#2a2213',ink:'#c9c2b0',mut:'#8a8475',brand:'#e0a95a',brandRGB:[224,169,90],land:[28,24,16],lc:[54,46,28],choke:[226,86,74]},
  'Ice / Steel':{bg:'#080b10',panel:'14,19,26',line:'#223044',ink:'#cdd6e2',mut:'#7d8a9e',brand:'#9fc0d8',brandRGB:[159,192,216],land:[24,30,40],lc:[46,58,76],choke:[224,120,120]},
  'Blackops':{bg:'#000000',panel:'6,10,7',line:'#14261a',ink:'#b9c9be',mut:'#5f705f',brand:'#3fb950',brandRGB:[63,185,80],land:[14,20,15],lc:[30,46,32],choke:[229,72,77]},
};
const FONT={'IBM Plex':["'IBM Plex Mono'","'IBM Plex Sans Condensed'"],'JetBrains':["'JetBrains Mono'","'Space Grotesk'"],'Oswald mix':["'JetBrains Mono'","'Oswald'"],'System':["ui-monospace,monospace","ui-monospace,monospace"]};
const state={pal:'Radar Cyan',font:'IBM Plex',vessel:'chevron',map:'graticule',scan:false,vig:false,glow:false,sonar:true};

// mini theater data
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const ships=[];const lane=[[103.8,1.3],[43.3,12.6],[32.35,30.0],[13,40]];
for(let s=0;s<lane.length-1;s++)for(let i=0;i<26;i++){const p=lerp(lane[s],lane[s+1],i/26);ships.push({pos:[p[0]+(Math.random()-.5)*1.4,p[1]+(Math.random()-.5)*1.4],course:Math.floor(Math.random()*360)});}
const SUEZ=[32.35,30.0];
const ocean=[{polygon:[[-40,-60],[140,-60],[140,75],[-40,75]]}];
function graticule(){const L=[];for(let lo=-30;lo<=120;lo+=10)L.push({p:[[lo,-50],[lo,70]]});for(let la=-40;la<=60;la+=10)L.push({p:[[-30,la],[120,la]]});return L;}
const ICON=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(
  s==='chevron'?'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2 L20 22 L12 17 L4 22 Z" fill="#fff"/></svg>':
  s==='triangle'?'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 3 L21 21 L3 21 Z" fill="#fff"/></svg>':
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2 L22 12 L12 22 L2 12 Z" fill="#fff"/></svg>');
let pulse=0;
function layers(){const P=PAL[state.pal];const L=[
  new SolidPolygonLayer({id:'ocean',data:ocean,getPolygon:d=>d.polygon,getFillColor:P.brandRGB.map((c,i)=>[9,14,26][i])}),
  new GeoJsonLayer({id:'land',data:'https://d2ad6b4ur7yvpq.cloudfront.net/naturalearth-3.3.0/ne_50m_admin_0_countries.geojson',getFillColor:P.land,getLineColor:P.lc,lineWidthMinPixels:.5,stroked:true,filled:true}),
];
  if(state.map==='graticule'||state.map==='chart')L.push(new PathLayer({id:'grat',data:graticule(),getPath:d=>d.p,getColor:[...P.brandRGB,28],getWidth:.5,widthMinPixels:.5}));
  L.push(new PathLayer({id:'lane',data:[lane],getPath:d=>d,getColor:[...P.brandRGB,120],getWidth:1.5,widthMinPixels:1}));
  L.push(new ScatterplotLayer({id:'choke',data:[{p:SUEZ}],getPosition:d=>d.p,getRadius:state.sonar?60000+pulse*80000:60000,radiusUnits:'meters',stroked:true,filled:false,getLineColor:[...P.choke,state.sonar?Math.floor(200*(1-pulse)):200],lineWidthMinPixels:1.5,updateTriggers:{getRadius:[state.sonar,pulse],getLineColor:[state.sonar,pulse]}}));
  if(state.glow)L.push(new ScatterplotLayer({id:'halo',data:ships,getPosition:d=>d.pos,getRadius:40000,radiusUnits:'meters',getFillColor:[...P.brandRGB,40]}));
  if(state.vessel==='dot')L.push(new ScatterplotLayer({id:'ships',data:ships,getPosition:d=>d.pos,getRadius:14000,radiusUnits:'meters',getFillColor:[...P.brandRGB,220]}));
  else L.push(new IconLayer({id:'ships',data:ships,getPosition:d=>d.pos,getIcon:d=>({url:ICON(state.vessel),width:24,height:24,anchorX:12,anchorY:12,mask:true}),sizeUnits:'pixels',getSize:13,getAngle:d=>-(d.course),getColor:[...P.brandRGB,235],updateTriggers:{getIcon:state.vessel,getColor:state.pal}}));
  return L;}
const dk=new DeckGL({container:'deck',views:new MapView({repeat:true}),initialViewState:{longitude:44,latitude:19,zoom:2.7},controller:{inertia:200,scrollZoom:{smooth:true}},parameters:{clearColor:[.023,.04,.06,1]},layers:layers()});
function raf(){if(state.sonar){pulse=(Date.now()%2600)/2600;dk.setProps({layers:layers()});}requestAnimationFrame(raf);}raf();
function apply(){const P=PAL[state.pal],F=FONT[state.font],r=document.documentElement.style;
  r.setProperty('--bg',P.bg);r.setProperty('--panel',P.panel);r.setProperty('--line',P.line);r.setProperty('--ink',P.ink);r.setProperty('--mut',P.mut);r.setProperty('--brand',P.brand);r.setProperty('--crit','rgb('+P.choke.join(',')+')');
  r.setProperty('--mono',F[0]);r.setProperty('--disp',F[1]);document.body.style.background=P.bg;
  document.body.classList.toggle('scan',state.scan);document.body.classList.toggle('vig',state.vig);document.body.classList.toggle('glow',state.glow);
  document.getElementById('cfg').textContent=`${state.pal} · ${state.font} · ${state.vessel} · ${state.map}`;
  dk.setProps({layers:layers()});}
function seg(id,opts,key,multi){const el=document.getElementById(id);el.innerHTML=opts.map(o=>`<span class="opt${(multi?state[o.k]:state[key]===o.v)?' on':''}" data-v="${o.v||''}" data-k="${o.k||''}">${o.l}</span>`).join('');
  el.querySelectorAll('.opt').forEach(x=>x.onclick=()=>{if(multi){state[x.dataset.k]=!state[x.dataset.k];}else{state[key]=x.dataset.v;}seg(id,opts,key,multi);apply();});}
seg('g_pal',Object.keys(PAL).map(v=>({v,l:v})),'pal');
seg('g_font',Object.keys(FONT).map(v=>({v,l:v})),'font');
seg('g_ves',[{v:'chevron',l:'Chevron'},{v:'triangle',l:'Triangle'},{v:'diamond',l:'Diamond'},{v:'dot',l:'Dot'}],'vessel');
seg('g_map',[{v:'flat',l:'Flat'},{v:'graticule',l:'Graticule'},{v:'chart',l:'Chart'}],'map');
seg('g_fx',[{k:'scan',l:'Scanlines'},{k:'vig',l:'Vignette'},{k:'glow',l:'Glow'},{k:'sonar',l:'Sonar'}],null,true);
apply();
</script>
